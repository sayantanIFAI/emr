[alembic]
script_location = db/alembic
prepend_sys_path = src
path_separator = os
# database URL is read from CDI_DATABASE_URL via env.py; this is only a fallback
sqlalchemy.url = postgresql+psycopg://cdi:cdi@localhost:5432/cdi

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
