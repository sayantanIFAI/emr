name: cdi-adapter

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cdi
      POSTGRES_PASSWORD: cdi
      POSTGRES_DB: cdi
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdi"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Object store: SeaweedFS (Apache-2.0) replaces MinIO (AGPL, archived upstream): docs/object-store.md.
  # master / volume / filer live inside this one container on 127.0.0.1; ONLY the S3 port is reachable
  # by the other services, and it is published on the host's loopback only. Telemetry, the Iceberg and
  # Lance gateways and the embedded IAM API are off. DEV ONLY: the keys in seaweedfs/s3.json are
  # throwaway; production identities come from infra/runpod/start_objectstore.sh.
  objectstore:
    image: chrislusf/seaweedfs:4.48
    command: >
      server -dir=/data -ip=127.0.0.1 -ip.bind=127.0.0.1
      -master.telemetry=false -master.volumeSizeLimitMB=1024 -volume.max=0
      -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=9000 -s3.ip.bind=0.0.0.0
      -s3.port.iceberg=0 -s3.port.lance=0 -s3.iam=false -s3.autoCreateBucket=false
      -s3.allowedOrigins=http://localhost:8080
    ports: ["127.0.0.1:9000:9000"]
    volumes:
      - objectdata:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # creates the bucket with the admin identity (the application key cannot); retries until ready
  createbuckets:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    command: python -m cdi_adapter.storage
    environment:
      CDI_S3_ENDPOINT_URL: http://objectstore:9000
      CDI_S3_ACCESS_KEY: devbucketadmin
      CDI_S3_SECRET_KEY: devbucketadminsecret
    depends_on:
      objectstore:
        condition: service_healthy

  migrate:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    command: alembic upgrade head
    environment:
      CDI_DATABASE_URL: postgresql+psycopg://cdi:cdi@postgres:5432/cdi
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    command: uvicorn cdi_adapter.api:app --host 0.0.0.0 --port 8080
    environment:
      CDI_DATABASE_URL: postgresql+psycopg://cdi:cdi@postgres:5432/cdi
      CDI_REDIS_URL: redis://redis:6379/0
      CDI_S3_ENDPOINT_URL: http://objectstore:9000
      CDI_INBOX_DIR: /data/inbox
      CDI_PROCESSED_DIR: /data/processed
      CDI_FAILED_DIR: /data/failed
    ports: ["8080:8080"]
    volumes:
      - inbox:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      objectstore:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    command: celery -A cdi_adapter.worker.celery_app worker -Q cdi -l info --concurrency 2
    environment:
      CDI_DATABASE_URL: postgresql+psycopg://cdi:cdi@postgres:5432/cdi
      CDI_REDIS_URL: redis://redis:6379/0
      CDI_S3_ENDPOINT_URL: http://objectstore:9000
    volumes:
      - inbox:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  watcher:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    command: python -m cdi_adapter.ingest.watcher
    environment:
      CDI_DATABASE_URL: postgresql+psycopg://cdi:cdi@postgres:5432/cdi
      CDI_REDIS_URL: redis://redis:6379/0
      CDI_S3_ENDPOINT_URL: http://objectstore:9000
      CDI_INBOX_DIR: /data/inbox
      CDI_PROCESSED_DIR: /data/processed
      CDI_FAILED_DIR: /data/failed
    volumes:
      - inbox:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      objectstore:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully

  # --- optional: local model gateway (needs an NVIDIA GPU + nvidia-container-toolkit) ---
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   command: >
  #     --model Qwen/Qwen2.5-VL-7B-Instruct --port 8000
  #     --max-model-len 16384 --gpu-memory-utilization 0.85
  #   ports: ["8000:8000"]
  #   deploy:
  #     resources:
  #       reservations:
  #         devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

volumes:
  pgdata:
  objectdata:
  inbox:
